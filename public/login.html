<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Explorer — Login</title>
  <style>
    :root {
      --bg: #f0ece3;
      --panel: #fffaf1;
      --panel-strong: #ffffff;
      --text: #221d17;
      --muted: #6d6459;
      --line: #d8cbb7;
      --accent: #8a3e27;
      --accent-soft: #f4dbcd;
      --shadow: 0 18px 40px rgba(71, 50, 25, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at top left, #fff7e7 0, transparent 36rem),
        linear-gradient(135deg, #efe7d8 0%, #ece4d4 32%, #e1d7c4 100%);
    }

    .login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 1rem;
      box-shadow: var(--shadow);
      padding: 2.5rem 2.2rem;
      width: 100%;
      max-width: 380px;
    }

    .eyebrow {
      margin: 0 0 0.35rem;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.13em;
      font-size: 0.75rem;
    }

    h1 {
      margin: 0 0 1.6rem;
      font-size: 2rem;
      line-height: 1;
    }

    form {
      display: grid;
      gap: 1rem;
    }

    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.9rem;
      color: var(--muted);
    }

    input {
      font: inherit;
      border: 1px solid var(--line);
      border-radius: 0.8rem;
      padding: 0.8rem 0.9rem;
      background: var(--panel-strong);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input:focus-visible {
      border-color: var(--accent);
      outline: none;
      box-shadow: 0 0 0 2px var(--accent-soft);
    }

    button {
      font: inherit;
      cursor: pointer;
      background: var(--accent);
      color: #fff9f2;
      border: 1px solid transparent;
      border-radius: 0.8rem;
      padding: 0.8rem 0.9rem;
      transition: filter 0.12s;
    }

    button:hover { filter: brightness(1.08); }
    button:active { filter: brightness(0.94); }

    .error {
      margin: 0;
      color: var(--accent);
      font-size: 0.88rem;
      min-height: 1.2em;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1816;
        --panel: #262220;
        --panel-strong: #2e2a27;
        --text: #e8e2d9;
        --muted: #9a8f82;
        --line: #3d3630;
        --accent: #d4724a;
        --accent-soft: #3d2518;
        --shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
      }

      body {
        background:
          radial-gradient(circle at top left, #2a2419 0, transparent 36rem),
          linear-gradient(135deg, #1a1816 0%, #1e1b18 32%, #161412 100%);
      }

      button { color: #faf5ec; }
    }
  </style>
</head>
<body>
  <div class="login-card">
    <p class="eyebrow">Archive-First Viewer</p>
    <h1>OpenClaw Explorer</h1>
    <form id="loginForm">
      <label>Username<input name="username" type="text" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button type="submit">Sign in</button>
      <p id="error" class="error"></p>
    </form>
  </div>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = new FormData(e.target);
      const errorEl = document.getElementById("error");
      errorEl.textContent = "";
      try {
        const res = await fetch("/api/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: form.get("username"), password: form.get("password") })
        });
        const data = await res.json();
        if (data.ok) {
          location.href = "/";
        } else {
          errorEl.textContent = data.error || "Login failed";
        }
      } catch (err) {
        errorEl.textContent = "Network error";
      }
    });
  </script>
</body>
</html>
