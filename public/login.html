<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenClaw Explorer — Sign In</title>
  <link rel="stylesheet" href="/login.css">
</head>
<body>
  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-header">
        <div class="login-icon">
          <svg viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"/>
            <path d="M2 17l10 5 10-5"/>
            <path d="M2 12l10 5 10-5"/>
          </svg>
        </div>
        <p class="login-eyebrow">Archive-First Viewer</p>
        <h1 class="login-title">OpenClaw Explorer</h1>
        <p class="login-subtitle">Sign in to access session data and archives</p>
      </div>
      <form id="loginForm" class="login-form">
        <div class="form-group">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username" placeholder="Enter your username">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="Enter your password">
        </div>
        <button type="submit" class="login-button">
          <span class="login-button-text">Sign in</span>
          <span class="login-button-loading" hidden>Signing in...</span>
        </button>
        <p id="error" class="login-error"></p>
      </form>
    </div>
    <p class="login-footer">OpenClaw Explorer · Local network access</p>
  </div>
  <script type="module" src="/login.js"></script>
</body>
</html>
